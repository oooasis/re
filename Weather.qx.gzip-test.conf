#!name = iRingo WeatherKit (Rewrite)
#!desc = QX 优化版：availability 原生 jq；天气/预警单次请求中继，不回落 Apple；端点出站走 world
#!author = 🌲
#!date = 2026-11-05

# 实际部署: https://raw.githubusercontent.com/oooasis/re/refs/heads/main/Weather.qx.conf
# 上游: https://github.com/NSRingo/WeatherKit/raw/main/modules/iRingo.WeatherKit.Rewrite.lpx

# 分流和重写统一保留在本文件中。
# 上游这条 QX 无法逐字翻译（有 ip-asn，但无 AND / PROTOCOL，重写资源也写不了 [general]）:
#   AND,((OR,((IP-ASN,714,no-resolve),(IP-ASN,6185,no-resolve))),(PROTOCOL,QUIC)),REJECT-DROP
# 主配置 [general] 可用 udp_drop_list = QUIC 阻断全部 QUIC；范围大于上游，不完全等价。

host, weather-analytics-events.apple.com, reject
host-suffix, tthr.apple.com, reject
host, tether.edge.apple, reject

host, weatherkit.pages.dev, world

# availability 只合并 JSON 能力列表，使用原生 jq 避免启动中继脚本。
^https?:\/\/weatherkit\.apple\.com\/api\/v1\/availability\/ url jsonjq-response-body 'if type == "array" then reduce (. + ["airQuality","currentWeather","forecastDaily","forecastHourly","forecastPeriodic","historicalComparisons","weatherChanges","forecastNextHour","weatherAlerts","weatherAlertNotifications","news"])[] as $cap ([]; if index($cap) == null then . + [$cap] else . end) else . end'
# 仅 dataSets 全为已核查的五类原样数据且查询明确时使用 Apple；其余中继。
# 未知数据集、编码参数名、重复 dataSets、配置参数等复杂情况均保守中继。
^https?:\/\/weatherkit\.apple\.com\/api\/v2\/weather\/(?![^?#]*\?(?:(?!dataSets=)[a-z][A-Za-z0-9_.~-]*=[^&#]*&)*dataSets=(?:locationInfo|news|forecastPeriodic|historicalComparisons|weatherChanges)(?:(?:,|%2[cC])(?:locationInfo|news|forecastPeriodic|historicalComparisons|weatherChanges))*(?:&(?!dataSets=)[a-z][A-Za-z0-9_.~-]*=[^&#]*)*$) url script-echo-response https://raw.githubusercontent.com/oooasis/re/refs/heads/main/Weather.qx.js
^https?:\/\/weatherkit\.apple\.com\/api\/v1\/weatherAlerts\?([^#]*&ids=[^&#]*-[0-9]{9}(?:&[^#]*)?)$ url script-echo-response https://raw.githubusercontent.com/oooasis/re/refs/heads/main/Weather.qx.js
^https?:\/\/weatherkit\.apple\.com\/api\/v1\/weatherAlerts\?([^#]*&ids=-?[0-9]+(?:\.[0-9]+)?,-?[0-9]+(?:\.[0-9]+)?(?:&[^#]*)?)$ url script-echo-response https://raw.githubusercontent.com/oooasis/re/refs/heads/main/Weather.qx.js

hostname = weatherkit.apple.com
