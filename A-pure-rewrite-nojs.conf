# 方案 A：零 JS，纯 request-header 改写 Host
#
# 依据：sample.conf:312 证明 request-header 的正则作用域包含请求行与全部头，
#       官方示例把 "GET /resource4/ HTTP/1.1" 改成了 "GET /api/ HTTP/1.1"。
#       既然请求行可改，同一头块里的 Host 头自然也可改。
#
# 未知：QX 是否会依据改写后的 Host 重新选择上游。
#       若 QX 在 HTTP 改写之前就已经建好到 Akamai 的连接（架构上很可能如此），
#       那么带着 Host: weatherkit.pages.dev 的请求会打到 Akamai → 404/403。
#       这是本方案能否成立的唯一变量，测一次即知。

host, weather-analytics-events.apple.com, reject
host-suffix, tthr.apple.com, reject
host, tether.edge.apple, reject

^https?:\/\/weatherkit\.apple\.com\/api\/v1\/availability\/ url request-header (\r\n)Host: *weatherkit\.apple\.com(\r\n) request-header $1Host: weatherkit.pages.dev$2
^https?:\/\/weatherkit\.apple\.com\/api\/v2\/weather\/ url request-header (\r\n)Host: *weatherkit\.apple\.com(\r\n) request-header $1Host: weatherkit.pages.dev$2
^https?:\/\/weatherkit\.apple\.com\/api\/v1\/weatherAlerts\? url request-header (\r\n)Host: *weatherkit\.apple\.com(\r\n) request-header $1Host: weatherkit.pages.dev$2

hostname = weatherkit.apple.com
