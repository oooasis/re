#!name=小红书 去首页视频（窄 MITM）
#!desc=实测有效：4 台主机，较通配符省 89.6% 解密
#!author=🌲

# 实测结论（2026-08-27）：
#   hostname = rec, gslb, mediacloud, www  → 有效（去掉 www 则失效）
#   原 *.xiaohongshu.com 覆盖 13 台 144 条请求，本配置 6 台 15 条，省 89.6%
#
# 为什么必须带 www —— HTTP/2 连接合并（RFC 9113 §9.1.1）：
#   GSLB 下发的 IP 显示 mall / rec / so / www 四个域名同为 117.185.25.254，
#   而站点证书是 CN=*.xiaohongshu.com（SAN: *.xiaohongshu.com, xiaohongshu.com）。
#   同 IP + 同证书覆盖 = 客户端可以把这四个域名的请求复用到同一条 h2 连接上。
#   若 www 不在 MITM 列表，QX 放行它的 TLS，App 拿到真实通配符证书协商出 h2，
#   随后的 rec 请求就直接合并到这条既有连接上 —— QX 再也看不到独立的 rec 连接，
#   下面的 jq 规则自然不会触发。
#   把 www 纳入 MITM 后，QX 用自签的单域证书终止它，合并被拒绝，
#   App 只能为 rec 另开连接，规则才跑得起来。
#   edith 之所以能安全去掉：它在 223.111.242.125，独立 IP，不参与合并。
#
# so 与 mall 同样落在 117.185.25.254 上，是同一个洞。20 秒抓包里它们 0 请求，
# 纳入 MITM 的额外开销几乎为零，作为保险一并加上——否则 App 若先连 so 或 mall，
# rec 仍可能合并过去而漏网（上游帖子评论区「有时候还是会有视频」大概率就是这个）。
#
# 规则来源：ddgksf2013 XiaoHongShuBlockVideo + XiaoHongShuAds 中与本问题相关的部分，
# jq 表达式与 BlockVideo 原文逐字一致。

# ── 去首页/同城视频 ────────────────────────────────────────
^https?:\/\/[a-z]+\.xiaohongshu\.com\/api/sns/v\d/(homefeed|localfeed) url jsonjq-response-body '.data |= map(select(.type == "normal"))'

# ── 拦 GSLB / HTTPDNS ─────────────────────────────────────
# gslb/v1/domainNew 会下发 12 个域名的直连 IP（含 rec），不拦则 App 绕开 DNS
# 按 IP 直连，QX 匹配不到 hostname，上面的改写不会触发。
^https?:\/\/[a-z]+\.xiaohongshu\.com\/api\/gslb    url reject-200
^https?:\/\/[a-z]+\.xiaohongshu\.com\/api\/httpdns url reject-200

# ── 广告端点（www 上的两条，顺带保留）──────────────────────
^https?:\/\/[a-z]+\.xiaohongshu\.com\/api\/sns\/v\d+\/tag\/ads_engage url reject-200
^https?:\/\/[a-z]+\.xiaohongshu\.com\/api\/sns\/v\d+\/ads\/apple\/record url reject-200

hostname = rec.xiaohongshu.com, www.xiaohongshu.com, so.xiaohongshu.com, mall.xiaohongshu.com, gslb.xiaohongshu.com, mediacloud.xiaohongshu.com
