#!name=小红书 去首页视频
#!desc=窄 MITM 版；只解密 rec + gslb 两台
#!author=🌲

# ── 为什么必须带上 gslb ────────────────────────────────────────────
# gslb.xiaohongshu.com/api/gslb/v1/domainNew 会给 App 下发 12 个域名的直连 IP,
# 其中包含 rec.xiaohongshu.com。App 一旦拿到 IP 就绕开 DNS 按 IP 直连,
# QX 匹配不到 hostname, 不解密, 改写规则空转。
# 墨鱼原版靠 *.xiaohongshu.com 顺带把 gslb 也 MITM 了, 那条 reject-200 才起作用,
# 这就是它有效而纯 rec 白名单无效的原因。
# 用 reject-200(空 200) 而不是分流层 reject(RST), 与墨鱼行为一致, App 回落更干净。
^https?:\/\/gslb\.xiaohongshu\.com\/api\/(gslb|httpdns) url reject-200

# ── 过滤视频 ──────────────────────────────────────────────────────
# 判据 .type == "video" 由抓包确认: 30 条 item = 23 normal + 7 video,
# video 条目 7/7 独有 video_info_v2, normal 条目无任何视频痕迹。
# 结尾 \? 必需: 不加会连 /homefeed/categories 一起匹配, 那个端点 data 是对象
# 不是数组, map() 会报错(墨鱼原版有此问题)。
# 外层 if 兜底: data 不是数组就原样返回。
^https?:\/\/rec\.xiaohongshu\.com\/api\/sns\/v\d+\/(homefeed|localfeed)\? url jsonjq-response-body 'if (.data|type) == "array" then .data |= map(select(.type? == "normal")) else . end'

hostname = rec.xiaohongshu.com, gslb.xiaohongshu.com, edith.xiaohongshu.com
