#!name=小红书 去首页视频（排除法）
#!desc=保留通配符 + 排除 9 台，与显式 6 台等价但抗新增子域
#!author=🌲

# 与 xhs-final.conf 覆盖面完全相同（15 条请求，省 89.6%），但更稳健：
#
#   显式白名单的失效方向：小红书新增一个落在 117.185.25.254 的子域 →
#     它不在列表里 → 不被 MITM → rec 可以合并过去 → 去视频间歇失效（危险）
#
#   排除法的失效方向：小红书新增一个埋点子域 →
#     它不在排除表里 → 被 MITM → 多几条解密开销 → 功能不受影响（安全）
#
# 排除的 9 台在 20 秒抓包中共 129 条请求，且对墨鱼 26 条规则命中数全部为 0：
#   edith 82（独立 IP 223.111.242.125，不参与连接合并，去掉安全）
#   t2 22 / apm-native 6 / as 5 / spider-tracker 5 / lng 5 / fe 2 / crash 1 / fe-resource-app 1
# 这 9 台已由实机验证：当前可用配置同样不包含它们。

^https?:\/\/[a-z]+\.xiaohongshu\.com\/api/sns/v\d/(homefeed|localfeed) url jsonjq-response-body '.data |= map(select(.type == "normal"))'
^https?:\/\/[a-z]+\.xiaohongshu\.com\/api\/gslb    url reject-200
^https?:\/\/[a-z]+\.xiaohongshu\.com\/api\/httpdns url reject-200
^https?:\/\/[a-z]+\.xiaohongshu\.com\/api\/sns\/v\d+\/tag\/ads_engage url reject-200
^https?:\/\/[a-z]+\.xiaohongshu\.com\/api\/sns\/v\d+\/ads\/apple\/record url reject-200

hostname = *.xiaohongshu.com, -edith.xiaohongshu.com, -t2.xiaohongshu.com, -apm-native.xiaohongshu.com, -as.xiaohongshu.com, -spider-tracker.xiaohongshu.com, -lng.xiaohongshu.com, -fe.xiaohongshu.com, -crash.xiaohongshu.com, -fe-resource-app.xiaohongshu.com
