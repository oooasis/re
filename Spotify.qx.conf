#!name = Spotify
#!desc = QX 版：部分解锁 Premium、去播放广告、歌手/专辑列表正常展示、去随机播放。登录后再启用，重启 App 等待生效；音质不能设为超高
#!date = 2026-10-11

# 实际部署: https://raw.githubusercontent.com/oooasis/re/refs/heads/main/Spotify.qx.conf
# 上游: https://github.com/daozen/rules/blob/master/module/spotify.conf
# 与上游差异: 两个 script-request-header 换成 request-header 正则（sample.conf 312-313 行写法），
#             script-response-body 换成 Spotify.proto.js（改写结果与上游 spotify-proto.js 一致，不加载 protobufjs）

# customize 请求头 If-None-Match 改名为 X-Spotify-INM，服务端不再返回 304 空 Body
^https:\/\/(?:[^\/]+-)?spclient(?:\.wg)?\.spotify\.com(?::443)?\/user-customization-service\/v1\/customize$ url request-header (\r\n)[Ii]f-[Nn]one-[Mm]atch: request-header $1X-Spotify-INM:
# 歌手/专辑页按 iPad 布局请求：改请求行里的 platform 参数
^https:\/\/(?:[^\/]+-)?spclient(?:\.wg)?\.spotify\.com(?::443)?\/(?:artistview\/v1\/artist|album-entity-view\/v2\/album)\/.*platform=iphone url request-header ^([A-Z]+\x20[^\x20]*platform=)iphone request-header $1ipad
# bootstrap / customize 响应 protobuf 改写
^https:\/\/(?:[^\/]+-)?spclient(?:\.wg)?\.spotify\.com(?::443)?\/(?:bootstrap\/v1\/bootstrap|user-customization-service\/v1\/customize)$ url script-response-body https://raw.githubusercontent.com/oooasis/re/refs/heads/main/Spotify.proto.js

hostname = spclient.wg.spotify.com, *-spclient.spotify.com
