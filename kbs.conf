#!name = 卡博士
#!desc = 清空小程序广告位下发，并拦截微信插屏广告视频
#!date = 2026-09-20

# 自有广告中心，三个广告位：index_top / index_bottom / device_detail_bottom
# 服务端自己就会返回 {"list":[],"total_rows":0}（index_bottom 实测如此），照抄这个形状最稳
# 清空后广告位配图（app.kbscloud.com/uploads/images/…）也不会再被请求
^https?:\/\/app\.kbscloud\.com\/api\/v1\/adscenter\/article\/getAdsList url jsonjq-response-body .data |= (.list = [] | .total_rows = 0)

# 设备详情接口夹带 advert_list，第一条是微信流量主 Banner（picurl 写着 domName:ad，带 adunit 广告位 ID）
# 只清这个键，押金 / 门店 / 会员 / 支付配置等其余 22 个键原样保留
^https?:\/\/app\.kbscloud\.com\/api\/devices\/device\/show url jsonjq-response-body .data.advert_list = []

# 启动插屏广告的视频素材。广告位 ID 打包在小程序里，不经卡博士服务器下发，只能拦素材。
# 只碰 wxsmw 一个主机，不含 wximg，视频号与朋友圈图片不受影响。
^https?:\/\/wxsmw\.wxs\.qq\.com\/.+\/ads_svp_video__ url reject-200

hostname = app.kbscloud.com, wxsmw.wxs.qq.com
