# 中国移动 去开屏广告 —— Quantumult X 版
# 上游: https://loon.103516.xyz/Plugin/ChinaMobile.lpx (2026-07-27)
#
# 只取上游 [Rewrite] 段的两条 reject 规则，正则逐字未改。
# 上游 [Script] 段（ChinaMobile.js，33 KB，AES 解密后做页面净化）未收录，原因见 README。

# 开屏与启动期广告
#   init/startInit          启动初始化 —— 开屏广告本体
#   explorePage/getAdverList 探索页广告位
#   emotionMarket            情感营销位
^https?:\/\/(client\.app\.coc|app)\.10086\.cn\/biz-orange\/DN\/(explorePage\/getAdverList|init\/startInit|emotionMarket) url reject-200

# 启动后立刻弹出的各类浮层
#   homepagePopup/getSortInfo    首页弹窗
#   dropsAdverService/getDropsAdverNew 掉落式广告
#   toast/getToastRule / getToast      toast 提示
#   liveSuspension/getPageCode         直播悬浮球
^https?:\/\/client\.app\.coc\.10086\.cn\/biz-orange\/(?:DN\/(?:dropsAdverService\/getDropsAdverNew|homepagePopup\/getSortInfo|toast\/getToastRule)|DH\/toast\/august\/getToast|DA\/liveSuspension\/getPageCode)(?:\?.*)?$ url reject-dict

hostname = client.app.coc.10086.cn, app.10086.cn
