# ⚠️ 实验用：A + B 联合方案（零 JS）
#
# 目标：
#   B 用 DNS alias 把 weatherkit.apple.com 的连接 IP 指向
#   weatherkit.pages.dev；A 再把 HTTP Host 改成 weatherkit.pages.dev。
#
# 本文件不能携带 [dns] 配置。测试前必须在主配置 [dns] 中加入：
#   alias = /weatherkit.apple.com/weatherkit.pages.dev
#
# 测试前必须禁用：
#   1. iRingo.WeatherKit.Rewrite.qx.conf（方案 C）
#   2. A-pure-rewrite-nojs.FAILED.conf
#   3. 其他匹配 weatherkit.apple.com 的 rewrite / DNS address
#
# 不要启用 skip_validating_cert。如果 Cloudflare 收到的上游 SNI 仍是
# weatherkit.apple.com，它会主动拒绝 TLS，跳过证书校验也无法解决。

# alias 只影响 QX 自己解析的直连请求，因此原域名必须 direct。
host, weatherkit.apple.com, direct

# 与上游 Rewrite 版相同的三条遥测/系统服务拒绝规则。
host, weather-analytics-events.apple.com, reject
host-suffix, tthr.apple.com, reject
host, tether.edge.apple, reject

# A：仅改 HTTP Host。成败取决于 QX 是否也把该 Host 用作上游 TLS SNI。
^https?:\/\/weatherkit\.apple\.com\/api\/v1\/availability\/ url request-header (\r\n)Host: *weatherkit\.apple\.com(\r\n) request-header $1Host: weatherkit.pages.dev$2
^https?:\/\/weatherkit\.apple\.com\/api\/v2\/weather\/ url request-header (\r\n)Host: *weatherkit\.apple\.com(\r\n) request-header $1Host: weatherkit.pages.dev$2
^https?:\/\/weatherkit\.apple\.com\/api\/v1\/weatherAlerts\?([^#]*&ids=[^&#]*-[0-9]{9}(?:&[^#]*)?)$ url request-header (\r\n)Host: *weatherkit\.apple\.com(\r\n) request-header $1Host: weatherkit.pages.dev$2
^https?:\/\/weatherkit\.apple\.com\/api\/v1\/weatherAlerts\?([^#]*&ids=-?[0-9]+(?:\.[0-9]+)?,-?[0-9]+(?:\.[0-9]+)?(?:&[^#]*)?)$ url request-header (\r\n)Host: *weatherkit\.apple\.com(\r\n) request-header $1Host: weatherkit.pages.dev$2

hostname = weatherkit.apple.com
