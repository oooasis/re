# iRingo WeatherKit (Rewrite) —— Quantumult X 版
# 规则范围与官方 Rewrite 版的 4 条 URL Rewrite 完全对应

# 分流：与官方 Rewrite 版 [Rule] 前三条等价
# （第四条 AND/OR + IP-ASN + PROTOCOL,QUIC 的逻辑规则 QX 不支持，无法翻译）
host, weather-analytics-events.apple.com, reject
host-suffix, tthr.apple.com, reject
host, tether.edge.apple, reject

# 重写：把三类端点交给中继脚本
^https?:\/\/weatherkit\.apple\.com\/api\/v1\/availability\/ url script-echo-response https://raw.githubusercontent.com/oooasis/re/refs/heads/main/iRingo.WeatherKit.Rewrite.qx.js
^https?:\/\/weatherkit\.apple\.com\/api\/v2\/weather\/ url script-echo-response https://raw.githubusercontent.com/oooasis/re/refs/heads/main/iRingo.WeatherKit.Rewrite.qx.js
^https?:\/\/weatherkit\.apple\.com\/api\/v1\/weatherAlerts\?([^#]*&ids=[^&#]*-[0-9]{9}(?:&[^#]*)?)$ url script-echo-response https://raw.githubusercontent.com/oooasis/re/refs/heads/main/iRingo.WeatherKit.Rewrite.qx.js
^https?:\/\/weatherkit\.apple\.com\/api\/v1\/weatherAlerts\?([^#]*&ids=-?[0-9]+(?:\.[0-9]+)?,-?[0-9]+(?:\.[0-9]+)?(?:&[^#]*)?)$ url script-echo-response https://raw.githubusercontent.com/oooasis/re/refs/heads/main/iRingo.WeatherKit.Rewrite.qx.js

hostname = weatherkit.apple.com
