# iRingo WeatherKit (Rewrite) —— Quantumult X / 302 版
#
# 规则动作取自 KOP-XIAO resource-parser 对上游 Loon 模块的实际转换结果：
#   Surge/Loon 的 `header` 内部改写 → QX 的 `url 302`
# 正则沿用上游原文（parser 会去掉开头的 ^ 锚点，这里保留，更严格）。
#
# ⚠️ 未验证：跨域 302 时 CFNetwork 是否保留 Authorization 头。
#    weatherkit.pages.dev 需要 Apple 的 JWT（实测 Bearer dummy 会让错误
#    从 MISSING JWT 变为 MALFORMED_AUTH，确认凭证在 Authorization 头里）。
#    若被剥离则天气加载失败 —— 装上一试即知。
#
# 若可用，更推荐直接指向上游让 QX 自动更新，本文件即可弃用：
#   https://github.com/NSRingo/WeatherKit/raw/main/modules/iRingo.WeatherKit.Rewrite.lpx, \
#     tag=WeatherKit, update-interval=86400, opt-parser=true, enabled=true

# ── 分流（parser 会丢弃上游 [Rule] 段，这里手动补回）──
host, weather-analytics-events.apple.com, reject
host-suffix, tthr.apple.com, reject
host, tether.edge.apple, reject

# ── 中继端点：官方注明直连、无需代理 ──
host, weatherkit.pages.dev, direct

# QX 不支持、无法翻译的上游规则：
#   AND,((OR,((IP-ASN,714,no-resolve),(IP-ASN,6185,no-resolve))),(PROTOCOL,QUIC)),REJECT-DROP

# ── 重写 ──
^https?:\/\/weatherkit\.apple\.com\/api\/v1\/availability\/ url 302 https://weatherkit.pages.dev/api/v1/availability/
^https?:\/\/weatherkit\.apple\.com\/api\/v2\/weather\/ url 302 https://weatherkit.pages.dev/api/v2/weather/
^https?:\/\/weatherkit\.apple\.com\/api\/v1\/weatherAlerts\?([^#]*&ids=[^&#]*-[0-9]{9}(?:&[^#]*)?)$ url 302 https://weatherkit.pages.dev/api/v1/weatherAlerts?$1
^https?:\/\/weatherkit\.apple\.com\/api\/v1\/weatherAlerts\?([^#]*&ids=-?[0-9]+(?:\.[0-9]+)?,-?[0-9]+(?:\.[0-9]+)?(?:&[^#]*)?)$ url 302 https://weatherkit.pages.dev/api/v1/weatherAlerts?$1

hostname = weatherkit.apple.com
